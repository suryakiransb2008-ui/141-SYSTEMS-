name: Build 141 Systems APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Patch Code and Init Android
        run: |
          mkdir -p assets
          touch assets/.keep
          sed -i "s|https://supabase.co|https://supabase.co|g" lib/main.dart
          sed -i "s|contentType:|contentType: AndroidContentType.sonification,|g" lib/main.dart
          sed -i "/AndroidContentType.sonification,$/N;s/\n.*AndroidContentType.sonification,//" lib/main.dart
          sed -i "s|withOpacity(0.25)|withValues(alpha: 0.25)|g" lib/main.dart
          flutter create --platforms=android --org com.taskforce141 .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 141-systems-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
