name: Build 141 Systems APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Patch Code and Init Android
        run: |
          mkdir -p assets
          touch assets/.keep
          python3 -c "
          s = open('lib/main.dart').read()
          s = s.replace('https://supabase.co', 'https://supabase.co')
          s = s.replace('withOpacity(0.25)', 'withValues(alpha: 0.25)')
          start = s.index('Future<void> _triggerMaxSiren()')
          end = s.index('Future<void> _stopSiren()')
          clean_fn = '''Future<void> _triggerMaxSiren() async {
            _alarmPlaying = true;
            try {
              await FlutterVolumeController.setVolume(1.0);
              await AudioPlayer.global.setAudioContext(AudioContext(
                android: const AudioContextAndroid(
                  usageType: AndroidUsageType.alarm,
                  contentType: AndroidContentType.sonification,
                  audioFocus: AndroidAudioFocus.gainTransientMayDuck,
                ),
              ));
              await _sirenPlayer.setReleaseMode(ReleaseMode.loop);
              await _sirenPlayer.play(AssetSource('sos.mp3'));
            } catch (_) {}
          }

          '''
          s = s[:start] + clean_fn + s[end:]
          open('lib/main.dart', 'w').write(s)
          "
          flutter create --platforms=android --org com.taskforce141 .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 141-systems-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
