name: Fix URLs in index.html
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's|https://unpkg.com"|https://unpkg.com"|g' index.html
          sed -i 's|https://unpkg.com"><|https://unpkg.com"><|g' index.html
          sed -i 's|https://jsdelivr.net"|https://jsdelivr.net"|g' index.html
          sed -i 's|https://supabase.co|https://supabase.co|g' index.html
          sed -i 's|https://arcgisonline.com|https://arcgisonline.com{z}/{y}/{x}|g' index.html
          git config user.name "141-bot"
          git config user.email "bot@141.local"
          git commit -am "Restore full CDN & Supabase URLs" || true
          git push
          
